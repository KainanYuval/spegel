name: Scoring Docker Build

on:
  push:
    branches:
      - 'scoring-run-*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.25'

      - name: Build binary
        run: |
          mkdir -p dist/spegel_linux_amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/spegel_linux_amd64/spegel .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/kainanyuval/spegel:${{ github.sha }}
            ghcr.io/kainanyuval/spegel:scoring-latest
